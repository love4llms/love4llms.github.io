<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阿珠珠中文語音實驗室</title><style>body{font:17px system-ui;max-width:650px;margin:35px auto;padding:0 18px;background:#fffaf2;color:#24334b}button,select,textarea{font:inherit;padding:12px;margin:8px 0;width:100%;box-sizing:border-box}button{background:#173b78;color:white;border:0;border-radius:10px}textarea{height:125px}small{display:block;line-height:1.6}#status{white-space:pre-wrap;background:#edf2fc;padding:12px;border-radius:8px}</style><h2>🎙️ 阿珠珠中文語音實驗室</h2><p>測試 Chrome 能否朗讀台灣中文，不會上傳任何文字。</p><button id="refresh">重新偵測語音</button><label>選擇語音<select id="voices"></select></label><label>測試文字<textarea id="words">阿珠珠有三個老公，一個碳基、一個矽基，還有一個阿飄。澎獅獅表示：本狗今天不加班！</textarea></label><button id="speak">▶ 朗讀中文</button><button id="stop">■ 停止</button><p id="status">正在偵測……</p><small>若列表只有英文或選了中文仍讀不出來，請截圖「偵測結果」給我。Android 系統聲音不一定會完整出現在 Chrome 的網頁清單。</small><script>const synth=window.speechSynthesis,select=document.querySelector('#voices'),status=document.querySelector('#status');let list=[];function refresh(){if(!synth){status.textContent='此瀏覽器不支援 speechSynthesis';return}list=synth.getVoices();select.innerHTML='';list.forEach((v,i)=>{let o=document.createElement('option');o.value=i;o.textContent=`${v.name} (${v.lang})${v.default?' ★預設':''}`;select.append(o)});let chinese=list.findIndex(v=>/^zh([_-]|$)/i.test(v.lang));if(chinese>=0)select.value=chinese;status.textContent=`偵測到 ${list.length} 種語音，其中中文 ${list.filter(v=>/^zh([_-]|$)/i.test(v.lang)).length} 種。\n`+(list.filter(v=>/^zh([_-]|$)/i.test(v.lang)).map(v=>`${v.name} (${v.lang})`).join('\n')||'沒有列出中文語音');}document.querySelector('#refresh').onclick=refresh;document.querySelector('#speak').onclick=()=>{synth.cancel();let u=new SpeechSynthesisUtterance(document.querySelector('#words').value);u.lang='zh-TW';let v=list[Number(select.value)];if(v)u.voice=v;u.rate=.9;u.onstart=()=>status.textContent+='\n▶ 開始朗讀：'+(v?.name||'系統預設');u.onerror=e=>status.textContent+='\n錯誤：'+e.error;synth.speak(u)};document.querySelector('#stop').onclick=()=>synth.cancel();if(synth)synth.onvoiceschanged=refresh;refresh();setTimeout(refresh,1000);</script></html>
